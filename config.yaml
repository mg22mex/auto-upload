autosell:
  base_url: https://www.autosell.mx
  catalog_path: /catalogo
  request_timeout_sec: 30
  delay_between_pages_sec: 0.5
  delay_between_details_sec: 0.3

sync:
  timezone: America/Chihuahua
  max_posts_per_account_per_run: 10
  removal_action: mark_sold  # mark_sold | delete
  # Live sync accounts. account_3 excluded until operator clears old FB listings.
  active_accounts:
    - account_1
    - account_2
  # Weekly bump: even ISO weeks = Renovar; odd = full repost (new URL).
  # Cron: Sunday 09:00 America/Chihuahua via .github/workflows/repost.yml
  weekly_bump:
    timezone: America/Chihuahua
    even_week: renew
    odd_week: repost
    schedule: "0 15 * * 0"
  renew:
    min_age_days: 7
    max_per_account_per_run: 25
    restart_browser_every: 10  # close/reopen Chromium to limit VPS RAM flake
    max_browser_reopens: 5
    schedule: "0 15 * * 0"  # Sunday 09:00 America/Chihuahua (UTC-6)
  # Full delete+recreate (slow; auto on odd ISO weeks, or run_repost.py manually)
  repost:
    min_age_days: 7
    max_per_account_per_run: 5  # smaller batches; browser restarts every N below
    restart_browser_every: 3
    max_browser_reopens: 5

facebook:
  location_city: Chihuahua
  location_state: Chihuahua
  country: MX
  max_photos_per_listing: 20
  headless: true
  create_url: https://www.facebook.com/marketplace/create/vehicle
  selling_url: https://www.facebook.com/marketplace/you/selling

accounts:
  - id: account_1
    session_dir: sessions/account_1
  - id: account_2
    session_dir: sessions/account_2
  - id: account_3
    session_dir: sessions/account_3
