autosell:
  base_url: https://www.autosell.mx
  catalog_path: /catalogo
  request_timeout_sec: 30
  delay_between_pages_sec: 0.5
  delay_between_details_sec: 0.3

sync:
  timezone: America/Chihuahua
  max_posts_per_account_per_run: 15
  max_listings_per_account: 25  # live Marketplace slots per FB profile
  slot_allocator:
    enabled: true
    # false = do not auto-delete extra live listings while downsizing from 1:1 clone
    enforce_overflow_removals: false
  removal_action: mark_sold  # mark_sold | delete
  # Live sync accounts. account_3 excluded until operator clears old FB listings.
  active_accounts:
    - account_1
    - account_2
  # Listing bump: daily incremental relist (FIFO by posted_at / last bump).
  # renew remains optional via weekly_bump.even_week / --mode renew.
  weekly_bump:
    timezone: America/Chihuahua
    even_week: repost
    odd_week: repost
    min_age_days: 2  # 1.5–2d window; use 1.5 via env if needed
    max_per_account_per_run: 25
    schedule: "0 15 * * *"  # daily 15:00 UTC ≈ 09:00 America/Chihuahua
  renew:
    min_age_days: 2
    max_per_account_per_run: 25
    restart_browser_every: 10  # close/reopen Chromium to limit VPS RAM flake
    max_browser_reopens: 5
    schedule: "0 15 * * *"
  # Full delete+recreate (primary bump path; listings ≥ min_age_days old)
  repost:
    min_age_days: 2
    # Hard delete before create — mark_sold alone often triggers FB "publicación duplicada"
    removal_action: delete
    max_per_account_per_run: 25  # daily incremental batch (not a full-catalog dump)
    restart_browser_every: 3
    max_browser_reopens: 5
    schedule: "0 15 * * *"

facebook:
  location_city: Chihuahua
  location_state: Chihuahua
  country: MX
  max_photos_per_listing: 20
  headless: true
  create_url: https://www.facebook.com/marketplace/create/vehicle
  selling_url: https://www.facebook.com/marketplace/you/selling

accounts:
  # facebook_profile = short label printed at repost start; facebook_c_user = FB cookie id
  - id: account_1
    session_dir: sessions/account_1
    # Business identity (Marco Autosell). Do not reuse this profile for account_2.
    facebook_c_user: "61568552875980"
    facebook_profile: "61568552875980"
  - id: account_2
    session_dir: sessions/account_2
    # Personal identity (Marco Gastelum). facebook_c_user is filled after headed login
    # (`scripts/fb_login.py` + `scripts/fb_whoami.py`); do not copy account_1's id.
    facebook_c_user: "100047574648142"
    facebook_profile: "marco.gastelum.3954"
  - id: account_3
    session_dir: sessions/account_3
