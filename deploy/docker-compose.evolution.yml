# Evolution API v2 — WhatsApp gateway (isolated from Playwright sessions/).
#
# From repo root (loads .env for ${WHATSAPP_API_KEY} interpolation):
#   docker compose -f deploy/docker-compose.evolution.yml up -d
#
# API bind: 127.0.0.1:8082  (not public). FastAPI webhook: host:8080/webhook/whatsapp
# Docker → host FastAPI needs uvicorn on 0.0.0.0 (see autosell-webhook.service).

name: autosell-evolution

services:
  evolution-postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_POSTGRES_PASSWORD:?set EVOLUTION_POSTGRES_PASSWORD in .env}
    volumes:
      - evolution_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - evolution

  evolution-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - evolution_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - evolution

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://127.0.0.1:8082}
      SERVER_PORT: "8080"
      AUTHENTICATION_API_KEY: ${WHATSAPP_API_KEY:?set WHATSAPP_API_KEY in .env}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_POSTGRES_PASSWORD}@evolution-postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: autosell_evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/1
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      RABBITMQ_ENABLED: "false"
      S3_ENABLED: "false"
      WEBHOOK_GLOBAL_ENABLED: "false"
      WEBHOOK_GLOBAL_URL: ${WHATSAPP_WEBHOOK_URL:-http://host.docker.internal:8080/webhook/whatsapp}
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      CONFIG_SESSION_PHONE_CLIENT: Chrome
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: "30"
      DEL_INSTANCE: "false"
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - evolution

volumes:
  evolution_pg:
  evolution_redis:
  evolution_instances:

networks:
  evolution:
    driver: bridge
