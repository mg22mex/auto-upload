name: Weekly Facebook repost

on:
  schedule:
    # Sunday 09:00 America/Chihuahua (UTC-6) ≈ 15:00 UTC
    - cron: "0 15 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan only (no Facebook actions)
        required: false
        default: false
        type: boolean
      max_per_account:
        description: Max reposts per account (empty = config default)
        required: false
        type: string

jobs:
  repost:
    name: Repost eligible listings (account_1 + account_2)
    runs-on: [self-hosted, fb-worker]
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -eux
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -c "from playwright.sync_api import sync_playwright; print('playwright OK')"
          python -m playwright install chromium

      - name: Verify Chromium can launch
        run: |
          set -eux
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              browser.close()
          print("Chromium launch OK")
          PY

      - name: Link persistent data (sync.db, sessions, snapshots)
        run: |
          mkdir -p ~/auto-upload-data/data/snapshots ~/auto-upload-data/sessions
          rm -rf data sessions
          ln -s ~/auto-upload-data/data data
          ln -s ~/auto-upload-data/sessions sessions

      - name: Scrape autosell.mx (fresh catalog for repost eligibility)
        env:
          AUTOSELL_BASE_URL: ${{ secrets.AUTOSELL_BASE_URL }}
        run: python run_sync.py --scrape-only --output data/catalog_latest.json

      - name: Weekly repost (respects holds; active_accounts in config.yaml)
        env:
          AUTOSELL_BASE_URL: ${{ secrets.AUTOSELL_BASE_URL }}
          REPOST_MIN_AGE_DAYS: ${{ secrets.REPOST_MIN_AGE_DAYS || '7' }}
          REPOST_MAX_PER_ACCOUNT_PER_RUN: ${{ inputs.max_per_account || secrets.REPOST_MAX_PER_ACCOUNT_PER_RUN || '10' }}
          FB_ACTION_DELAY_MIN_SEC: ${{ secrets.FB_ACTION_DELAY_MIN_SEC }}
          FB_ACTION_DELAY_MAX_SEC: ${{ secrets.FB_ACTION_DELAY_MAX_SEC }}
          REMOVAL_ACTION: ${{ secrets.REMOVAL_ACTION }}
          FB_HEADLESS: ${{ secrets.FB_HEADLESS }}
          DB_PATH: data/sync.db
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -eux
          EXTRA=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA="--dry-run"
          fi
          if [ -n "${{ secrets.REPOST_DRY_RUN }}" ] && [ "${{ secrets.REPOST_DRY_RUN }}" = "true" ]; then
            EXTRA="--dry-run"
          fi
          python scripts/run_repost.py --all-eligible $EXTRA
