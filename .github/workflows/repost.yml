name: Facebook relist / repost bump

# Intentionally NO push/pull_request — full Playwright/FB work is schedule or
# manual only. Code-push lint lives in .github/workflows/test.yml.
on:
  schedule:
    # Daily 09:00 America/Chihuahua (UTC-6) ≈ 15:00 UTC
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = config (default repost both weeks); or force renew/repost"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - renew
          - repost
      dry_run:
        description: Plan only (no Facebook actions)
        required: false
        default: false
        type: boolean
      max_per_account:
        description: Max reposts per account (empty = 15)
        required: false
        type: string
      account:
        description: Limit to one account (e.g. account_2). Empty = active accounts
        required: false
        type: string
      ids:
        description: Comma-separated autosell ids (skips --all-eligible). Empty = eligible
        required: false
        type: string
      force:
        description: Ignore holds and min-age; repost all live catalog listings
        required: false
        default: false
        type: boolean
      min_age_days:
        description: Min days since last post (0 = include listings from the last 1–7 days). Empty = config
        required: false
        type: string

jobs:
  listing-bump:
    name: Daily incremental bump (15/account, 3d+)
    # Refuse any accidental non-schedule/manual dispatch (e.g. misadded push)
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, fb-worker]
    concurrency:
      group: facebook-bump
      cancel-in-progress: false
    # Hard cap: kill hung Playwright/Chromium instead of multi-hour overlaps.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -eux
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -c "from playwright.sync_api import sync_playwright; print('playwright OK')"
          python -m playwright install chromium

      - name: Verify Chromium can launch
        run: |
          set -eux
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              browser.close()
          print("Chromium launch OK")
          PY

      - name: Link persistent data (sync.db, sessions, snapshots)
        run: |
          mkdir -p ~/auto-upload-data/data/snapshots ~/auto-upload-data/sessions
          rm -rf data sessions
          ln -s ~/auto-upload-data/data data
          ln -s ~/auto-upload-data/sessions sessions

      - name: Scrape autosell.mx (fresh catalog for eligibility)
        env:
          AUTOSELL_BASE_URL: ${{ secrets.AUTOSELL_BASE_URL }}
        run: |
          set -eux
          python run_sync.py --scrape-only --output data/catalog_latest.json
          mkdir -p data/snapshots
          cp -f data/catalog_latest.json data/snapshots/catalog_latest.json

      - name: Sync Odoo product inventory
        env:
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_USER: ${{ secrets.ODOO_USER }}
          ODOO_PASSWORD: ${{ secrets.ODOO_PASSWORD }}
          ODOO_USERNAME: ${{ secrets.ODOO_USERNAME }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
        run: python scripts/sync_odoo_inventory.py --from-snapshot data/snapshots/catalog_latest.json
        continue-on-error: true

      - name: "Resolve bump mode (default: repost)"
        id: mode
        run: |
          set -eux
          MODE_INPUT="${{ inputs.mode || 'auto' }}"
          if [ -n "${{ secrets.WEEKLY_BUMP_MODE }}" ]; then
            MODE_INPUT="${{ secrets.WEEKLY_BUMP_MODE }}"
          fi
          RESOLVED=$(python - <<PY
          from src.sync.weekly_bump import resolve_weekly_bump_mode, weekly_bump_config
          import yaml
          from pathlib import Path
          cfg = yaml.safe_load(Path("config.yaml").read_text(encoding="utf-8")) or {}
          bump = weekly_bump_config(cfg)
          print(resolve_weekly_bump_mode(
              timezone=bump["timezone"],
              even_week=bump["even_week"],
              odd_week=bump["odd_week"],
              force_mode="${MODE_INPUT}" or None,
          ))
          PY
          )
          echo "resolved=${RESOLVED}" >> "$GITHUB_OUTPUT"
          echo "Listing bump mode: ${RESOLVED} (input=${MODE_INPUT})"

      - name: Relist (repost) or optional renew
        env:
          AUTOSELL_BASE_URL: ${{ secrets.AUTOSELL_BASE_URL }}
          RENEW_MIN_AGE_DAYS: ${{ secrets.RENEW_MIN_AGE_DAYS || secrets.REPOST_MIN_AGE_DAYS || '3' }}
          REPOST_MIN_AGE_DAYS: ${{ secrets.REPOST_MIN_AGE_DAYS || secrets.RENEW_MIN_AGE_DAYS || '3' }}
          RENEW_MAX_PER_ACCOUNT_PER_RUN: ${{ inputs.max_per_account || secrets.RENEW_MAX_PER_ACCOUNT_PER_RUN || '15' }}
          REPOST_MAX_PER_ACCOUNT_PER_RUN: ${{ inputs.max_per_account || secrets.REPOST_MAX_PER_ACCOUNT_PER_RUN || '15' }}
          PYTHONUNBUFFERED: "1"
          FB_REPOST_BROWSER_EVERY: ${{ secrets.FB_REPOST_BROWSER_EVERY || '3' }}
          FB_RENEW_BROWSER_EVERY: ${{ secrets.FB_RENEW_BROWSER_EVERY || '10' }}
          FB_BROWSER_REOPEN_MAX: ${{ secrets.FB_BROWSER_REOPEN_MAX || '5' }}
          FB_RENEW_DELAY_MIN_SEC: ${{ secrets.FB_RENEW_DELAY_MIN_SEC || '20' }}
          FB_RENEW_DELAY_MAX_SEC: ${{ secrets.FB_RENEW_DELAY_MAX_SEC || '40' }}
          FB_HEADLESS: ${{ secrets.FB_HEADLESS || 'true' }}
          DB_PATH: data/sync.db
          WEEKLY_BUMP_MODE: ${{ inputs.mode || secrets.WEEKLY_BUMP_MODE || 'auto' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -eux
          export PYTHONUNBUFFERED=1
          MAX_ARG="${{ inputs.max_per_account }}"
          if [ -z "$MAX_ARG" ]; then
            MAX_ARG="${REPOST_MAX_PER_ACCOUNT_PER_RUN:-15}"
          fi

          EXTRA=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA="--dry-run"
          fi
          if [ -n "${{ secrets.RENEW_DRY_RUN }}" ] && [ "${{ secrets.RENEW_DRY_RUN }}" = "true" ]; then
            EXTRA="--dry-run"
          fi
          if [ -n "${{ secrets.REPOST_DRY_RUN }}" ] && [ "${{ secrets.REPOST_DRY_RUN }}" = "true" ]; then
            EXTRA="--dry-run"
          fi
          MODE="${{ inputs.mode || 'auto' }}"
          ACCOUNT_ARGS=()
          if [ -n "${{ inputs.account }}" ]; then
            ACCOUNT_ARGS=(--account "${{ inputs.account }}")
          fi
          FORCE_ARGS=()
          if [ "${{ inputs.force }}" = "true" ]; then
            FORCE_ARGS=(--force)
          fi
          AGE_ARGS=()
          if [ -n "${{ inputs.min_age_days }}" ]; then
            AGE_ARGS=(--min-age-days "${{ inputs.min_age_days }}")
          fi
          if [ -n "${{ inputs.ids }}" ]; then
            python -u scripts/run_weekly_bump.py --mode "$MODE" \
              "${ACCOUNT_ARGS[@]}" "${FORCE_ARGS[@]}" "${AGE_ARGS[@]}" \
              --max-per-account "$MAX_ARG" \
              --ids "${{ inputs.ids }}" $EXTRA
          else
            python -u scripts/run_weekly_bump.py --mode "$MODE" \
              "${ACCOUNT_ARGS[@]}" "${FORCE_ARGS[@]}" "${AGE_ARGS[@]}" \
              --all-eligible --skip-scrape --max-per-account "$MAX_ARG" $EXTRA
          fi
