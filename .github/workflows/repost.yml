name: Weekly Facebook renew

on:
  schedule:
    # Sunday 09:00 America/Chihuahua (UTC-6) ≈ 15:00 UTC
    - cron: "0 15 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan only (no Facebook actions)
        required: false
        default: false
        type: boolean
      max_per_account:
        description: Max renews per account (empty = config default)
        required: false
        type: string

jobs:
  renew:
    name: Renew eligible listings (account_1 + account_2)
    runs-on: [self-hosted, fb-worker]
    # Renew is fast (~seconds each); 90 min is plenty for 25×2
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -eux
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -c "from playwright.sync_api import sync_playwright; print('playwright OK')"
          python -m playwright install chromium

      - name: Verify Chromium can launch
        run: |
          set -eux
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              browser.close()
          print("Chromium launch OK")
          PY

      - name: Link persistent data (sync.db, sessions, snapshots)
        run: |
          mkdir -p ~/auto-upload-data/data/snapshots ~/auto-upload-data/sessions
          rm -rf data sessions
          ln -s ~/auto-upload-data/data data
          ln -s ~/auto-upload-data/sessions sessions

      - name: Scrape autosell.mx (fresh catalog for renew eligibility)
        env:
          AUTOSELL_BASE_URL: ${{ secrets.AUTOSELL_BASE_URL }}
        run: python run_sync.py --scrape-only --output data/catalog_latest.json

      - name: Weekly renew / Renovar (same URL; respects holds)
        env:
          AUTOSELL_BASE_URL: ${{ secrets.AUTOSELL_BASE_URL }}
          RENEW_MIN_AGE_DAYS: ${{ secrets.RENEW_MIN_AGE_DAYS || secrets.REPOST_MIN_AGE_DAYS || '7' }}
          RENEW_MAX_PER_ACCOUNT_PER_RUN: ${{ inputs.max_per_account || secrets.RENEW_MAX_PER_ACCOUNT_PER_RUN || '25' }}
          FB_RENEW_DELAY_MIN_SEC: ${{ secrets.FB_RENEW_DELAY_MIN_SEC || '20' }}
          FB_RENEW_DELAY_MAX_SEC: ${{ secrets.FB_RENEW_DELAY_MAX_SEC || '40' }}
          FB_HEADLESS: ${{ secrets.FB_HEADLESS }}
          DB_PATH: data/sync.db
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -eux
          EXTRA=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA="--dry-run"
          fi
          if [ -n "${{ secrets.RENEW_DRY_RUN }}" ] && [ "${{ secrets.RENEW_DRY_RUN }}" = "true" ]; then
            EXTRA="--dry-run"
          fi
          python scripts/run_renew.py --all-eligible $EXTRA
