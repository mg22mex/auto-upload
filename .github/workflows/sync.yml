name: Sync autosell → Facebook

on:
  schedule:
    # 08:00 and 12:00 America/Chihuahua (UTC-6). Adjust if DST differs.
    - cron: "0 14 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      skip_odoo:
        description: "Skip Odoo fetch (Use local cached catalog_latest.json)"
        required: false
        type: boolean
        default: false
      force:
        description: "After catalog sync, relist all live listings (ignore min-age)"
        required: false
        type: boolean
        default: false
      older_than:
        description: "Alias for min_age_days. 0 = process all live listings."
        required: false
        type: string
      min_age_days:
        description: "After catalog sync, relist listings this old (default 2). 0 = all. Empty on schedule = skip relist."
        required: false
        type: string

# autosell.mx blocks or ignores GitHub-hosted runner IP ranges (connect timeout).
# Scrape + diff + Facebook all run on the self-hosted fb-worker.

jobs:
  sync:
    name: Scrape + diff (+ Facebook on Phase 2)
    runs-on: [self-hosted, fb-worker]
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -eux
          # Always use python -m pip so packages land in setup-python's interpreter
          # (bare `pip` on self-hosted runners often targets a different Python).
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -c "from playwright.sync_api import sync_playwright; print('playwright OK')"
          python -m playwright install chromium

      # OS libraries for Chromium are machine-wide and must be installed once on
      # fb-worker (see SETUP.md). Do NOT run `sudo python -m playwright install-deps`
      # here: under sudo, setup-python's site-packages are often invisible, which
      # fails with "No module named playwright" even when the prior step succeeded.
      - name: Verify Chromium can launch
        run: |
          set -eux
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              browser.close()
          print("Chromium launch OK")
          PY

      - name: Link persistent data (sync.db, sessions, snapshots)
        run: |
          mkdir -p ~/auto-upload-data/data/snapshots ~/auto-upload-data/sessions
          rm -rf data sessions
          ln -s ~/auto-upload-data/data data
          ln -s ~/auto-upload-data/sessions sessions

      - name: Scrape autosell.mx public catalog
        if: ${{ inputs.skip_odoo != true }}
        env:
          AUTOSELL_BASE_URL: ${{ secrets.AUTOSELL_BASE_URL }}
        run: |
          set -eux
          python run_sync.py --scrape-only --output data/catalog_latest.json
          mkdir -p data/snapshots
          cp -f data/catalog_latest.json data/snapshots/catalog_latest.json

      - name: Use cached catalog (skip scrape + Odoo)
        if: ${{ inputs.skip_odoo == true }}
        run: |
          set -eux
          test -f data/catalog_latest.json
          mkdir -p data/snapshots
          cp -f data/catalog_latest.json data/snapshots/catalog_latest.json
          echo "SKIP_ODOO: using cached catalog ($(wc -c < data/catalog_latest.json) bytes)"

      - name: Sync Odoo product inventory
        if: ${{ inputs.skip_odoo != true }}
        env:
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_USER: ${{ secrets.ODOO_USER }}
          ODOO_PASSWORD: ${{ secrets.ODOO_PASSWORD }}
          # Canonical names also accepted by OdooCRMClient
          ODOO_USERNAME: ${{ secrets.ODOO_USERNAME }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
        run: python scripts/sync_odoo_inventory.py --from-snapshot data/snapshots/catalog_latest.json

      - name: Diff and sync (live on account_1 + account_2; account_3 via config active_accounts)
        env:
          AUTOSELL_BASE_URL: ${{ secrets.AUTOSELL_BASE_URL }}
          DRY_RUN: ${{ secrets.DRY_RUN || 'false' }}
          SKIP_ODOO: ${{ inputs.skip_odoo == true && 'true' || 'false' }}
          MAX_POSTS_PER_ACCOUNT_PER_RUN: ${{ secrets.MAX_POSTS_PER_ACCOUNT_PER_RUN || '3' }}
          FB_ACTION_DELAY_MIN_SEC: ${{ secrets.FB_ACTION_DELAY_MIN_SEC || '60' }}
          FB_ACTION_DELAY_MAX_SEC: ${{ secrets.FB_ACTION_DELAY_MAX_SEC || '120' }}
          REMOVAL_ACTION: ${{ secrets.REMOVAL_ACTION || 'mark_sold' }}
          FB_HEADLESS: ${{ secrets.FB_HEADLESS || 'true' }}
          DB_PATH: data/sync.db
          SNAPSHOT_DIR: data/snapshots
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -eux
          EXTRA=()
          if [ "${{ inputs.skip_odoo }}" = "true" ]; then
            EXTRA=(--skip-odoo)
          fi
          python run_sync.py --from-snapshot data/catalog_latest.json "${EXTRA[@]}"

      - name: Relist old listings (optional dispatch)
        if: >-
          github.event_name == 'workflow_dispatch' &&
          (inputs.force == true || inputs.older_than || inputs.min_age_days)
        env:
          AUTOSELL_BASE_URL: ${{ secrets.AUTOSELL_BASE_URL }}
          REPOST_MIN_AGE_DAYS: ${{ secrets.REPOST_MIN_AGE_DAYS || '2' }}
          REPOST_MAX_PER_ACCOUNT_PER_RUN: ${{ secrets.REPOST_MAX_PER_ACCOUNT_PER_RUN || '25' }}
          PYTHONUNBUFFERED: "1"
          FB_HEADLESS: ${{ secrets.FB_HEADLESS || 'true' }}
          DB_PATH: data/sync.db
          SKIP_ODOO: ${{ inputs.skip_odoo == true && 'true' || 'false' }}
        run: |
          set -eux
          AGE="${{ inputs.older_than }}"
          if [ -z "$AGE" ]; then
            AGE="${{ inputs.min_age_days }}"
          fi
          AGE_ARGS=()
          if [ -n "$AGE" ]; then
            AGE_ARGS=(--min-age-days "$AGE")
          fi
          FORCE_ARGS=()
          if [ "${{ inputs.force }}" = "true" ]; then
            FORCE_ARGS=(--force)
          fi
          SKIP_ODOO_ARGS=()
          if [ "${{ inputs.skip_odoo }}" = "true" ]; then
            SKIP_ODOO_ARGS=(--skip-odoo)
          fi
          python -u scripts/run_weekly_bump.py --mode repost --all-eligible --skip-scrape \
            "${FORCE_ARGS[@]}" "${AGE_ARGS[@]}" "${SKIP_ODOO_ARGS[@]}"

      - name: Upload catalog snapshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-latest
          path: data/catalog_latest.json
          if-no-files-found: ignore
          retention-days: 14
